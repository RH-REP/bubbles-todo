<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 前の名前（2026-11-13 Issue #51 で、サーバーなし版を solo.html から noserver.html へ名前を変えた）。
     前の住所を覚えた栞・ホーム画面のアイコンから来た人を、新しい名前へ送るだけのページ。
     スクリプトは使わない（meta の refresh だけ）。記録はページの住所ではなくドメインごとに残るので、移っても消えない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta http-equiv="refresh" content="0; url=noserver.html">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubbles（サーバーなし版）へ移ります</title>
</head>
<body>
<p>サーバーなし版の住所が変わりました。<a href="noserver.html">noserver.html</a> へ移ります。</p>
</body>
</html>
