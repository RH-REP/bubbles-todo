<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- サーバーなし版（2026-11-08 Issue #31）。index.html と同じ app で、違いは次の4つだけ（index.html を直したら、ここも同じに直す。
     tests/chain.test.mjs が、違いがこの4つだけかを見る）:
     ・下の CSP … 通信してよい先を、自分のページ・AI の窓口・天気・Solana の公式 RPC（devnet・mainnet）に決め打ちにする。
       ページに悪いプログラムが入っても、キーや記録をよその住所へ送れない（ブラウザが止める）。
       <meta> の CSP では frame-ancestors などが効かない。サーバーには繋がらない（設定にサーバーの欄を出さない）
     ・bubbles-edition … 設定がこれを見て、ブロックチェーンへの控え（js/chain.js）を出す
     ・manifest … ホーム画面から開いたときも、このページで開く
     ・title -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://api.open-meteo.com https://api.devnet.solana.com https://api.mainnet-beta.solana.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="bubbles-edition" content="solo">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bubbles（サーバーなし版）— 気づいたら書く</title>

<!-- ホーム画面に追加したときの姿（PWA）。
     ・manifest … 名前・アイコン・standalone（ブラウザの枠を出さない）
     ・theme-color … 上のステータスバーの色。明暗で bg に合わせる
     ・apple- … iOS はまだ manifest を全部は見ない。同じことを別の口で言う
     status-bar-style は default。black-translucent にすると水がステータスバーの
     下まで回り込むが、そのぶん上の帯（長期保留）が文字の裏に潜る。
     安全領域（safe-t）の手当ては入れてあるので、変えるならそこも見ること。 -->
<link rel="manifest" href="manifest-solo.json">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15151a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bubbles">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<!-- 入口を1つにする（Issue #38）。サーバーに繋いでいるかで、index.html（サーバーあり）と solo.html（サーバーなし）の合うほうへ移す -->
<script src="js/boot-edition.js"></script>
<!-- dvh を知らないブラウザ（Android の Chrome 107 まで・WebView 103）だけ、実際の画面の高さを --app-h に入れる。
     100vh はアドレスバーを隠したときの高さなので、そのままだと下のタブが画面の外に出る（css/base.css .app） -->
<!-- 中身は js/boot-dvh.js（ページの中に直書きしない。配るときの CSP が script-src 'self' のため） -->
<script src="js/boot-dvh.js"></script>
<!-- 左上に出す版（正本は sw.js の VERSION） -->
<script src="js/version.js"></script>
<!-- 前の版に戻す（js/rollback.js。Issue #21）。前の版から戻ったとき、store.js が読む前に、落ちた欄を写しから埋め戻す -->
<script src="js/rollback.js"></script>
<link rel="stylesheet" href="css/base.css">
<!-- bubble.css は base.css のあと。タブバーの持ち上げなど、骨格の上書きが入るため -->
<link rel="stylesheet" href="css/bubble.css">
<link rel="stylesheet" href="css/focus.css">
<link rel="stylesheet" href="css/quad.css">
<link rel="stylesheet" href="css/deadline.css">
<link rel="stylesheet" href="css/screens/sea.css">
<link rel="stylesheet" href="css/screens/today.css">
<link rel="stylesheet" href="css/screens/plan.css">
<link rel="stylesheet" href="css/screens/gap.css">
<link rel="stylesheet" href="css/screens/review.css">
<link rel="stylesheet" href="css/screens/stub.css">
<!-- ヘルプ画面（js/help.js。設定の「ヘルプ」から開く。2026-11-04 Issue #9） -->
<link rel="stylesheet" href="css/help.css">
<!-- 個人と共有の帯（js/space.js）。--safe-t を上書きするので最後に読む -->
<link rel="stylesheet" href="css/space.css">
</head>
<body>

<div class="app">
  <!-- 画面はここに差し込まれる（js/app.js が画面モジュールを mount する） -->
  <div class="panes" id="panes"></div>
  <!-- 下タブ。js/app.js が画面一覧から組み立てる。
       ナビゲーションであると同時に、バブルの落下先でもある。 -->
  <nav class="tabbar" id="tabbar" aria-label="画面切り替え"></nav>
</div>

<!-- ドラッグ中だけバブルを退避させる層。画面をまたいでタブの上まで運べるようにするため -->
<div class="drag-layer" id="drag-layer"></div>

<!-- 画面の !（改善のコメント）。普通の script なので module（app.js）より先に走り、
     app.js が AppFeedback.install を呼ぶ。正本は issue_hub/feedback/feedback.js -->
<script src="js/feedback.js"></script>
<script type="module" src="js/app.js"></script>

<!-- オフラインで開けるようにする（sw.js を見よ）。
     ・失敗しても黙って進む。service worker はあくまで足し物で、
       無くてもアプリはそのまま動く（file:// で開いたときは登録できない）
     ・updateViaCache:'none' … sw.js 自身を HTTP キャッシュから読ませない。
       ここを既定のままにすると、直しても最大24時間気づかれないことがある
     ・新しい版が効くのは**次に開いたとき**。走っている module を差し替えないため -->
<script src="js/sw-register.js"></script>
</body>
</html>
