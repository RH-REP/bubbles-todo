# 失敗や上限超えを10分に20回くり返した接続元を、1時間ファイアウォールで締め出す。
# server.py の中の上限（guard.py）は記憶の中だけで、再起動で消える。こちらは OS で締め出す二段目。
# tools/server-setup.sh（BUBBLES_MODE=public）が /etc/fail2ban/jail.d/bubbles.conf に置く。
[bubbles]
enabled = true
backend = systemd
filter = bubbles
port = http,https
maxretry = 20
findtime = 10m
bantime = 1h
