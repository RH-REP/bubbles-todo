# Bubbles の守りの出来事（server.py が標準エラーに出す「bubbles: auth-fail ip=…」など）を読む。
# tools/server-setup.sh（BUBBLES_MODE=public）が /etc/fail2ban/filter.d/bubbles.conf に置く。
[Definition]
failregex = bubbles: (?:auth-fail|auth-blocked|rate-limit|conn-limit) ip=<HOST>(?:\s|$)
ignoreregex =
journalmatch = _SYSTEMD_UNIT=__SERVICE__.service
